# Generated zones for jankurai-tools-analyzers.
# This is a single-purpose Rust crate workspace. The only generated output tree
# is target/, produced by Cargo. It is never hand-edited and is regenerated by
# the build, so it is excluded from the audit scan and never committed.

[[zone]]
path = "target/"
source = "crates/jankurai (Cargo workspace)"
command = "cargo build --workspace --locked"
read_only = true
write_policy = "generated_output"
